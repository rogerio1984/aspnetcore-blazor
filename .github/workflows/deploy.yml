name: CI/CD Blazor WASM

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # Ajuste se usar outra versão
    
    - name: Restore
      run: dotnet restore ScreenSound.sln
    
    - name: Build
      run: dotnet build ScreenSound.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test ScreenSound.sln --configuration Release --no-build --verbosity normal
      # Adicione coverage se tiver: --collect:"XPlat Code Coverage"
    
    - name: Publish WASM
      run: dotnet publish ScreenSound.WebAssembly/ScreenSound.WebAssembly.csproj --configuration Release --output ./publish --no-build
    
    - name: Deploy to GitHub Pages (opcional, só em main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./publish/wwwroot
