name: CI/CD Blazor WASM
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore workloads & packages  # Força WASM
      run: |
        dotnet workload restore
        dotnet restore ScreenSound.sln
    
    - name: Build solution
      run: dotnet build ScreenSound.sln --configuration Release --no-restore
    
    - name: Test solution
      run: dotnet test ScreenSound.sln --configuration Release --no-build --verbosity normal
    
    - name: Publish WASM client (com runtime)
      run: |
        dotnet publish ScreenSound.WebAssembly/ScreenSound.WebAssembly.csproj \
          --configuration Release \
          --output ./publish \
          --no-build \
          --self-contained false \
          -r browser-wasm  # 👈 Força runtime WASM/JS
    
    - name: Debug: Listar arquivos publish  # 👈 Pra ver se _framework tá lá
      run: ls -la ./publish/wwwroot/_framework/
    
    - name: Setup Pages (só main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/configure-pages@v5
    
    - name: Upload artifact (só main
