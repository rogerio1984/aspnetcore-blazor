name: CI/CD Blazor WASM
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 👈 Fix Node warning
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore workloads  # 👈 SUBSTITUI o install wasm-tools
      run: dotnet workload restore
    
    - name: Restore packages
      run: dotnet restore ScreenSound.sln
    
    - name: Build
      run: dotnet build ScreenSound.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test ScreenSound.sln --configuration Release --no-build --verbosity normal
    
    - name: Publish WASM (self-contained)
      run: dotnet publish ScreenSound.WebAssembly/ScreenSound.WebAssembly.csproj --configuration Release --output ./publish --self-contained --no-build
    
    - name: Deploy to GitHub Pages (só em main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./publish/wwwroot
